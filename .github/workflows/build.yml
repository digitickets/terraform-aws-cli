name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        terraform_version:
          - 1.17.1
          - 1.16.2
          - 1.15.9
          - 1.14.9
          - 1.13.5
          - 1.12.2
          - 1.11.4
          - 1.10.5
          - 1.9.8
          - 1.8.5
          - 1.7.5
          - 1.6.6

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install tfenv
        run: |
          git clone https://github.com/tfutils/tfenv.git $HOME/.tfenv
          echo "$HOME/.tfenv/bin" >> $GITHUB_PATH

      - name: Install Terraform v${{ matrix.terraform_version }}
        run: |
          echo ${{ matrix.terraform_version }} > .terraform-version
          tfenv install ${{ matrix.terraform_version }}
          tfenv use ${{ matrix.terraform_version }}

      - name: Check tools
        run: |
          terraform version
          jq --version
          shellcheck --version

      # shellcheck, terraform fmt/validate, script tests, and terraform test. A fake `aws` is used; AWS is never called.
      - name: Run checks and tests
        run: tests/run.sh
